name: Inspect PRIME DROP catalog language

on:
  push:
    branches:
      - intervention/03-catalog-language
    paths:
      - .github/workflows/inspect-catalog-language.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/03-catalog-language
      - name: Inspect catalog-facing language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')

          print('=== CATALOG SECTION ===')
          start = html.find('id="catalogo"')
          if start == -1:
              start = html.find("id='catalogo'")
          if start != -1:
              snippet = html[max(0,start-1800):start+12000]
              snippet = re.sub(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+', '[BASE64_IMAGE]', snippet)
              print(snippet)

          print('\n=== CUSTOMER-FACING TEXT MATCHES ===')
          terms = ['Shop', 'Comprar', 'Instagram', 'Disponible', 'Agotado', 'Stock', 'Talla', 'Pieza', 'Producto', 'Catálogo', 'Ver más', 'Reservar', 'Drop', 'Próxim']
          for term in terms:
              print(f'--- {term} ---')
              for m in re.finditer(re.escape(term), html, re.I):
                  a = max(0, m.start()-140)
                  b = min(len(html), m.end()+220)
                  s = html[a:b]
                  s = re.sub(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+', '[BASE64_IMAGE]', s)
                  s = re.sub(r'\s+', ' ', s)
                  print(s[:500])
          PY
