name: PRIME DROP Point 9 variants
on:
  push:
    branches: [intervention/09-product-variants]
    paths:
      - .github/workflows/patch-point9.yml
      - .github/scripts/patch_point9.py
      - .github/scripts/run_point9_patch.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/09-product-variants
      - name: Apply Point 9 variants
        run: python .github/scripts/run_point9_patch.py
      - name: Validate and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html panel-privado.html
          git commit -m "Add product color variants"
          git push origin HEAD:intervention/09-product-variants
