name: Run PRIME DROP color swatches

on:
  push:
    branches:
      - intervention/09-product-variants
    paths:
      - .github/workflows/run-color-swatches.yml
      - .github/scripts/refine_color_swatches.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/09-product-variants
      - name: Apply swatch refinement
        run: python .github/scripts/refine_color_swatches.py
      - name: Validate and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use visual color swatches for jacket selection"
          git push origin HEAD:intervention/09-product-variants
