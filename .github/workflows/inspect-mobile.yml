name: Inspect PRIME DROP mobile

on:
  push:
    branches:
      - intervention/06-mobile
    paths:
      - .github/workflows/inspect-mobile.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/06-mobile
      - name: Inspect responsive CSS and mobile markup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')

          print('=== MEDIA QUERIES ===')
          for m in re.finditer(r'@media\s*\([^\{]+\)\s*\{', html):
              start = m.start()
              depth = 0
              i = m.end()-1
              end = None
              while i < len(html):
                  if html[i] == '{': depth += 1
                  elif html[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i+1
                          break
                  i += 1
              if end:
                  block = html[start:end]
                  if len(block) < 14000:
                      print('\n--- MEDIA BLOCK ---')
                      print(block)

          print('\n=== KEY BASE CSS ===')
          selectors = ['.hero {', '.hero-inner {', '.hero-copy {', '.hero-actions {', '.catalog-head {', '.section-head {', '.filters {', '.catalog {', '.grid {', '.card {', '.card-media {', '.card-info {', '.upcoming-section {', '.footer {']
          for sel in selectors:
              i = html.find(sel)
              if i != -1:
                  print('\n--', sel, '--')
                  print(html[i:i+1800])

          print('\n=== VIEWPORT META ===')
          m = re.search(r'<meta[^>]+name=["\']viewport["\'][^>]*>', html, re.I)
          print(m.group(0) if m else 'NO VIEWPORT META')

          print('\n=== HERO HTML ===')
          i = html.find('<section class="hero"')
          if i != -1:
              j = html.find('</section>', i)
              print(html[i:j+10][:9000])

          print('\n=== CATALOG HEAD/FILTER HTML ===')
          i = html.find('id="catalogo"')
          if i != -1:
              print(html[max(0,i-1200):i+4500])
          PY
