name: PRIME DROP Point 12 panel polish
on:
  push:
    branches:
      - intervention/12-reservations-internal
    paths:
      - .github/workflows/polish-point12-panel.yml
      - .github/scripts/polish_point12_panel.py
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/12-reservations-internal
      - name: Apply Point 12 panel UX polish
        run: python .github/scripts/polish_point12_panel.py
      - name: Validate and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-privado.html
          git commit -m "Polish internal operations panel"
          git push origin HEAD:intervention/12-reservations-internal
