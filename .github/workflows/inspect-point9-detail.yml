name: Inspect Point 9 detail
on:
  push:
    branches: [intervention/09-product-variants]
    paths: [.github/workflows/inspect-point9-detail.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/09-product-variants
      - name: Detail
        run: |
          python - <<'PY'
          from pathlib import Path
          for f,a,b in [('index.html',1388,1592),('panel-privado.html',490,605)]:
              lines=Path(f).read_text(encoding='utf-8').splitlines()
              print('===',f,a,b,'===')
              for i in range(a,b+1):
                  line=lines[i-1]
                  if 'base64,' in line.lower() or len(line)>1600: print(f'{i}: [long omitted]')
                  else: print(f'{i}: {line}')
          PY
