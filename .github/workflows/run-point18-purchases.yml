name: PRIME DROP Point 18 purchases
on:
  push:
    branches: [intervention/18-purchases-reinvestment]
    paths: ['.github/scripts/p18_part0.txt', '.github/scripts/p18_part1.txt', '.github/scripts/p18_part2.txt', '.github/workflows/run-point18-purchases.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/18-purchases-reinvestment
      - name: Build and run patch
        run: |
          cat .github/scripts/p18_part0.txt .github/scripts/p18_part1.txt .github/scripts/p18_part2.txt > /tmp/point18.py
          python /tmp/point18.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re, tempfile, subprocess
          s=Path('panel-privado.html').read_text(encoding='utf-8')
          for token in ['Compras y reinversión','inventory_purchases','create_inventory_purchase','receive_inventory_purchase','cancel_inventory_purchase']:
              assert token in s, token
          clean=re.sub(r'<!--.*?-->', '', s, flags=re.S)
          scripts=re.findall(r'<script>(.*?)</script>', clean, flags=re.S)
          js='\n'.join(scripts)
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
              f.write(js); path=f.name
          subprocess.run(['node','--check',path], check=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-privado.html
          git commit -m "Add internal purchases and reinvestment workflow"
          git push origin HEAD:intervention/18-purchases-reinvestment
