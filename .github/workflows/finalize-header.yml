name: Finalize PRIME DROP header

on:
  push:
    branches:
      - intervention/01-header-instagram
    paths:
      - .github/workflows/finalize-header.yml

permissions:
  contents: write

jobs:
  finalize-header:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout intervention branch
        uses: actions/checkout@v4
        with:
          ref: intervention/01-header-instagram

      - name: Apply final header adjustments
        run: python .github/scripts/finalize_header.py

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git commit -m "Polish header responsive breakpoint and mobile menu"
          git push origin HEAD:intervention/01-header-instagram
