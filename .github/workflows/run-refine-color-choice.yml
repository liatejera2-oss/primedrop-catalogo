name: Run color choice refinement
on:
  push:
    branches:
      - intervention/09-product-variants
    paths:
      - .github/workflows/run-refine-color-choice.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/09-product-variants
      - run: python .github/scripts/refine_color_choice.py
      - run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html panel-privado.html
          git commit -m "Refine color selection for Adidas jackets"
          git push origin HEAD:intervention/09-product-variants
