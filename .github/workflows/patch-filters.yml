name: PRIME DROP filters

on:
  push:
    branches:
      - intervention/05-filters
    paths:
      - .github/workflows/patch-filters.yml

permissions:
  contents: write

jobs:
  patch-filters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/05-filters
      - name: Apply filter patch
        run: python .github/scripts/patch_filters.py
      - name: Validate and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine catalog filters and responsive behavior"
          git push origin HEAD:intervention/05-filters
