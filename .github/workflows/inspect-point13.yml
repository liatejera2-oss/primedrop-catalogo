name: PRIME DROP inspect Point 13
on:
  push:
    branches: [intervention/13-how-to-buy]
    paths: ['.github/workflows/inspect-point13.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/13-how-to-buy
      - name: Print how-to-buy context
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          keys=['Cómo comprar','Como comprar','how-to','howto','Compra por Instagram']
          seen=set()
          for key in keys:
              start=0
              while True:
                  i=s.lower().find(key.lower(), start)
                  if i<0: break
                  a=max(0,i-1800); b=min(len(s),i+4200)
                  block=s[a:b]
                  marker=(a,b)
                  if marker not in seen:
                      print('\n===== MATCH',key,'AT',i,'=====\n')
                      print(block)
                      seen.add(marker)
                  start=i+1
          PY