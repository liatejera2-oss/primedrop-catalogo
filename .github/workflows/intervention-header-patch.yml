name: PRIME DROP header intervention

on:
  push:
    branches:
      - intervention/01-header-instagram
    paths:
      - .github/workflows/intervention-header-patch.yml

permissions:
  contents: write

jobs:
  patch-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout intervention branch
        uses: actions/checkout@v4
        with:
          ref: intervention/01-header-instagram

      - name: Apply surgical header patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          old_nav = '''<div class="header-links">
    <a class="catalog-link" href="#catalogo" aria-current="page">Catálogo</a>
    <a class="header-cta" href="https://instagram.com/primedrop.pa" target="_blank" rel="noopener noreferrer">Comprar en Instagram ↗</a>
  </div>'''
          new_nav = '''<button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primaryNav" aria-label="Abrir menú de navegación">
    <span class="menu-toggle-label">Menú</span>
    <span class="menu-toggle-icon" aria-hidden="true"><span></span><span></span></span>
  </button>
  <div class="header-links" id="primaryNav">
    <a class="catalog-link" href="#catalogo">Catálogo</a>
    <a class="drops-link" href="#upcomingSectionHead">Próximos Drops</a>
    <a class="header-cta" href="https://www.instagram.com/primedrop.pa/" target="_blank" rel="noopener noreferrer">Comprar por Instagram ↗</a>
  </div>'''

          if old_nav not in html:
              raise SystemExit('Expected header navigation block was not found; aborting without changes.')
          html = html.replace(old_nav, new_nav, 1)

          old_css = '''.header-links { display: flex; align-items: center; gap: 24px; }
  .catalog-link { position: relative; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink); text-decoration: none; padding: 8px 2px; transition: color .2s ease; }
  .catalog-link::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 2px; height: 1.5px; background: var(--accent); }
  .catalog-link:hover, .catalog-link:focus-visible { color: var(--ink); }
  .header-cta { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 7px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: #fff; text-decoration: none; background: var(--ink); padding: 10px 18px; border-radius: var(--radius-pill); transition: transform .2s ease, background .2s ease; min-height: 40px; }
  .header-cta:hover, .header-cta:focus-visible { background: #000; transform: translateY(-1px); }'''
          new_css = '''.header-links { display: flex; align-items: center; gap: 24px; }
  .catalog-link, .drops-link { position: relative; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink); text-decoration: none; padding: 8px 2px; transition: color .2s ease; }
  .catalog-link::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 2px; height: 1.5px; background: var(--accent); }
  .catalog-link:hover, .catalog-link:focus-visible, .drops-link:hover, .drops-link:focus-visible { color: var(--ink); }
  .header-cta { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 7px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: #fff; text-decoration: none; background: var(--ink); padding: 10px 18px; border-radius: var(--radius-pill); transition: transform .2s ease, background .2s ease; min-height: 40px; }
  .header-cta:hover, .header-cta:focus-visible { background: #000; transform: translateY(-1px); }
  .menu-toggle { display: none; border: 1px solid var(--line); background: var(--card-bg); color: var(--ink); border-radius: var(--radius-pill); min-height: 40px; padding: 8px 13px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; align-items: center; gap: 9px; cursor: pointer; }
  .menu-toggle-icon { width: 16px; height: 12px; display: inline-flex; flex-direction: column; justify-content: space-between; }
  .menu-toggle-icon span { width: 100%; height: 1.5px; background: currentColor; border-radius: 2px; transition: transform .2s ease; transform-origin: center; }
  .menu-toggle[aria-expanded="true"] .menu-toggle-icon span:first-child { transform: translateY(5.25px) rotate(45deg); }
  .menu-toggle[aria-expanded="true"] .menu-toggle-icon span:last-child { transform: translateY(-5.25px) rotate(-45deg); }
  @media (max-width: 700px) {
    .header-inner { position: relative; flex-wrap: nowrap; }
    .brand-word { font-size: 14.5px; }
    .menu-toggle { display: inline-flex; margin-left: auto; }
    .header-links { position: absolute; top: calc(100% + 1px); left: 16px; right: 16px; z-index: 60; display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 12px; background: var(--card-bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 38px rgba(17,17,17,.10); opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-8px); transition: opacity .18s ease, transform .18s ease, visibility .18s ease; }
    .header-links.is-open { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
    .catalog-link, .drops-link { padding: 11px 12px; border-radius: 9px; }
    .catalog-link::after { display: none; }
    .catalog-link:hover, .catalog-link:focus-visible, .drops-link:hover, .drops-link:focus-visible { background: var(--bg-alt); }
    .header-cta { justify-content: center; margin-top: 4px; }
  }'''

          if old_css not in html:
              raise SystemExit('Expected header CSS block was not found; aborting without changes.')
          html = html.replace(old_css, new_css, 1)

          script = '''
<script>
  (() => {
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.getElementById('primaryNav');
    if (!toggle || !nav) return;

    const setOpen = (open) => {
      nav.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Cerrar menú de navegación' : 'Abrir menú de navegación');
    };

    toggle.addEventListener('click', () => setOpen(toggle.getAttribute('aria-expanded') !== 'true'));
    nav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => setOpen(false)));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        setOpen(false);
        toggle.focus();
      }
    });
    document.addEventListener('click', (event) => {
      if (!nav.contains(event.target) && !toggle.contains(event.target)) setOpen(false);
    });
    window.addEventListener('resize', () => {
      if (window.innerWidth > 700) setOpen(false);
    });
  })();
</script>
'''

          if 'id="primaryNav"' not in html:
              raise SystemExit('New navigation markup missing after replacement.')
          if '</body>' not in html:
              raise SystemExit('Closing body tag not found; aborting without changes.')
          html = html.replace('</body>', script + '</body>', 1)

          if html == original:
              raise SystemExit('No changes generated; aborting.')

          checks = [
              'href="#upcomingSectionHead">Próximos Drops</a>',
              'href="https://www.instagram.com/primedrop.pa/"',
              '>Comprar por Instagram ↗</a>',
              'aria-controls="primaryNav"',
              "const nav = document.getElementById('primaryNav')",
          ]
          missing = [item for item in checks if item not in html]
          if missing:
              raise SystemExit(f'Post-patch validation failed: {missing}')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git commit -m "Refine header navigation and Instagram CTA"
          git push origin HEAD:intervention/01-header-instagram
