name: PRIME DROP header intervention

on:
  push:
    branches:
      - intervention/01-header-instagram
    paths:
      - .github/workflows/intervention-header-patch.yml

permissions:
  contents: write

jobs:
  patch-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout intervention branch
        uses: actions/checkout@v4
        with:
          ref: intervention/01-header-instagram
      - name: Patch header
        run: python .github/scripts/patch_header.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git commit -m "Refine header navigation and Instagram CTA"
          git push origin HEAD:intervention/01-header-instagram
