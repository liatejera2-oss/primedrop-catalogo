name: PRIME DROP refine Point 12 controls
on:
  push:
    branches:
      - intervention/12-reservations-internal
    paths:
      - .github/workflows/refine-point12-controls.yml
      - .github/scripts/refine_point12_controls.py
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/12-reservations-internal
      - name: Apply Point 12 controls refinement
        run: python .github/scripts/refine_point12_controls.py
      - name: Validate and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-privado.html index.html
          git commit -m "Refine internal controls and catalog metadata sync"
          git push origin HEAD:intervention/12-reservations-internal
