name: PRIME DROP Point 13
on:
  push:
    branches:
      - intervention/13-how-to-buy
    paths:
      - .github/scripts/point13.py
      - .github/workflows/run-point13.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/13-how-to-buy
      - name: Patch
        run: python .github/scripts/point13.py
      - name: Validate
        run: git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine how-to-buy guidance"
          git push origin HEAD:intervention/13-how-to-buy
