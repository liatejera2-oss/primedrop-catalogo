name: PRIME DROP upcoming drops refinement

on:
  push:
    branches:
      - intervention/07-upcoming-drops
    paths:
      - .github/workflows/patch-upcoming.yml
      - .github/scripts/patch_upcoming.py

permissions:
  contents: write

jobs:
  patch-upcoming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/07-upcoming-drops
      - name: Apply upcoming drops refinement
        run: python .github/scripts/patch_upcoming.py
      - name: Validate and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine upcoming drops presentation and migration"
          git push origin HEAD:intervention/07-upcoming-drops
