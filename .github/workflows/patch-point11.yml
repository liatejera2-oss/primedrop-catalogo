name: PRIME DROP Point 11 purchase flow
on:
  push:
    branches:
      - intervention/11-purchase-flow
    paths:
      - .github/workflows/patch-point11.yml
      - .github/scripts/patch_point11.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/11-purchase-flow
      - name: Apply Point 11 purchase flow
        run: python .github/scripts/patch_point11.py
      - name: Validate and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine purchase flow to Instagram"
          git push origin HEAD:intervention/11-purchase-flow
