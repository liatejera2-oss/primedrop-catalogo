name: Inspect Point 9 product variants

on:
  push:
    branches:
      - intervention/09-product-variants
    paths:
      - .github/workflows/inspect-point9.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/09-product-variants
      - name: Inspect variant and purchase logic
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = {
              'index.html': ['SIZE_ORDER','renderAllSizeRows','renderAllStatusTags','renderAllPurchaseButtons','create_purchase_request','purchase','size-row','data-size','product_variants','catalog =','loadCatalog','openPurchase','instagram'],
              'panel-privado.html': ['SIZE_ORDER','product_variants','inventoryBody','loadInventory','save-inventory','data-size','newProduct','publish_upcoming_product']
          }
          for filename, needles in targets.items():
              text = Path(filename).read_text(encoding='utf-8')
              lines = text.splitlines()
              print(f'=== {filename} total lines {len(lines)} ===')
              hit_lines = []
              for i,line in enumerate(lines,1):
                  low = line.lower()
                  if any(n.lower() in low for n in needles):
                      if 'base64,' in low or len(line) > 1400:
                          continue
                      hit_lines.append(i)
              windows=[]
              for n in hit_lines:
                  a=max(1,n-6); b=min(len(lines),n+14)
                  if windows and a <= windows[-1][1]+1:
                      windows[-1]=(windows[-1][0], max(windows[-1][1],b))
                  else:
                      windows.append((a,b))
              for a,b in windows[:80]:
                  print(f'--- {a}-{b} ---')
                  for i in range(a,b+1):
                      line=lines[i-1]
                      if 'base64,' in line.lower() or len(line)>1400:
                          print(f'{i}: [long line omitted]')
                      else:
                          print(f'{i}: {line}')
          PY
