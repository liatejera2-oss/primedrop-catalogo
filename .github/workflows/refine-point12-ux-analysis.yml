name: PRIME DROP refine Point 12 UX and analysis
on:
  push:
    branches: [intervention/12-ux-finance-analysis]
    paths:
      - '.github/scripts/refine_point12_ux_analysis.py'
      - '.github/workflows/refine-point12-ux-analysis.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/12-ux-finance-analysis
      - name: Apply UX and analysis refinement
        run: python .github/scripts/refine_point12_ux_analysis.py
      - name: Validate and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-privado.html
          git commit -m "Refine panel UX and add demand analysis"
          git push origin HEAD:intervention/12-ux-finance-analysis
