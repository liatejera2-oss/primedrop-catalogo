name: PRIME DROP Point 12 internal reservations
on:
  push:
    branches: [intervention/12-reservations-internal]
    paths:
      - .github/workflows/patch-point12.yml
      - .github/scripts/patch_point12.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/12-reservations-internal
      - name: Apply Point 12 internal reservation flow
        run: python .github/scripts/patch_point12.py
      - name: Validate and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-privado.html
          git commit -m "Add internal reservation workflow"
          git push origin HEAD:intervention/12-reservations-internal
