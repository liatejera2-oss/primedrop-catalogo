name: Inspect Point 10 Instagram message
on:
  push:
    branches: [intervention/10-instagram-message]
    paths: [.github/workflows/inspect-point10.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/10-instagram-message
      - name: Inspect current Instagram purchase message flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          lines=p.read_text(encoding='utf-8').splitlines()
          keys=['instagram','message','order_number','order number','dm','direct','window.open','ig.me','purchase','amount_due_now','balance_due','payment_mode','producto:','talla:','color:','cantidad:']
          hits=[]
          for i,line in enumerate(lines,1):
              low=line.lower()
              if any(k in low for k in keys):
                  if 'base64,' in low or len(line)>1600:
                      continue
                  hits.append(i)
          windows=[]
          for n in hits:
              a=max(1,n-8); b=min(len(lines),n+18)
              if windows and a<=windows[-1][1]+1:
                  windows[-1]=(windows[-1][0],max(windows[-1][1],b))
              else:
                  windows.append((a,b))
          for a,b in windows[:70]:
              print(f'--- {a}-{b} ---')
              for i in range(a,b+1):
                  line=lines[i-1]
                  if 'base64,' in line.lower() or len(line)>1600:
                      print(f'{i}: [long line omitted]')
                  else:
                      print(f'{i}: {line}')
          PY
