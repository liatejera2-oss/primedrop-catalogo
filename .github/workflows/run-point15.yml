name: PRIME DROP Point 15
on:
  push:
    branches: [intervention/15-performance]
    paths: ['.github/scripts/point15.py', '.github/workflows/run-point15.yml']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/15-performance
      - name: Extract embedded images
        run: python .github/scripts/point15.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'data:image/' not in s
          assets=list(Path('assets/media').glob('*'))
          assert len(assets) >= 10, len(assets)
          assert Path('index.html').stat().st_size < 2_000_000, Path('index.html').stat().st_size
          assert 'fetchpriority="high"' in s
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/media
          git commit -m "Extract embedded images for faster catalog loading"
          git push origin HEAD:intervention/15-performance
