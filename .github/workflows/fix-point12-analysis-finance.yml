name: PRIME DROP validate Point 12 analysis finance
on:
  push:
    branches: [intervention/12-ux-finance-analysis]
    paths: ['.github/workflows/fix-point12-analysis-finance.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/12-ux-finance-analysis
      - name: Tighten financial consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('panel-privado.html')
          s=p.read_text(encoding='utf-8')
          old="    const collected = paidSales + activeDeposits;\n"
          new="    const collected = paid.reduce((sum, o) => sum + Number(o.amount_paid || 0), 0) + activeDeposits;\n"
          if old not in s: raise SystemExit('collected anchor missing')
          s=s.replace(old,new,1)
          old2="        document.getElementById('searchBtn').click();\n        loadOrders(activeStatus);\n        loadInventory();\n"
          new2="        document.getElementById('searchBtn').click();\n        loadOrders(activeStatus);\n        loadFinancialSummary();\n        loadInventory();\n"
          if old2 not in s: raise SystemExit('search refresh anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate HTML JavaScript and commit
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('panel-privado.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/panel-inline.js').write_text(inline,encoding='utf-8')
          print('inline scripts:', len(scripts), 'bytes:', len(inline))
          PY
          node --check /tmp/panel-inline.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-privado.html
          git commit -m "Tighten finance summary consistency"
          git push origin HEAD:intervention/12-ux-finance-analysis
