name: PRIME DROP Point 10 Instagram message
on:
  push:
    branches: [intervention/10-instagram-message]
    paths:
      - .github/workflows/patch-point10.yml
      - .github/scripts/patch_point10.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/10-instagram-message
      - name: Apply Point 10 message refinement
        run: python .github/scripts/patch_point10.py
      - name: Validate and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine Instagram purchase message"
          git push origin HEAD:intervention/10-instagram-message
