name: PRIME DROP fix Point 12 table width
on:
  push:
    branches:
      - intervention/12-reservations-internal
    paths:
      - .github/workflows/fix-point12-table-width.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/12-reservations-internal
      - name: Fill panel table containers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('panel-privado.html')
          s=p.read_text(encoding='utf-8')
          anchor='  .upcoming-scroll table { min-width:1020px; }\n'
          replacement='  .upcoming-scroll table { min-width:1020px; }\n  .orders-scroll table, .inventory-scroll table, .upcoming-scroll table { width:100%; }\n'
          if anchor not in s:
              raise SystemExit('table width anchor not found')
          p.write_text(s.replace(anchor,replacement,1),encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-privado.html
          git commit -m "Fill internal panel tables"
          git push origin HEAD:intervention/12-reservations-internal
