name: Inspect PRIME DROP card hierarchy

on:
  push:
    branches:
      - intervention/04-card-hierarchy
    paths:
      - .github/workflows/inspect-card-hierarchy.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/04-card-hierarchy
      - name: Inspect card markup and styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          print('=== CARD CSS ===')
          start = html.find('.card {')
          if start != -1:
              end = html.find('.upcoming-section', start)
              if end == -1: end = start + 14000
              css = html[start:end]
              css = re.sub(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+', '[BASE64_IMAGE]', css)
              print(css[:16000])
          print('\n=== FIRST MAIN CARD ===')
          start = html.find('<article class="card"')
          if start != -1:
              end = html.find('</article>', start)
              snippet = html[start:end+10]
              snippet = re.sub(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+', '[BASE64_IMAGE]', snippet)
              print(snippet[:12000])
          print('\n=== FIRST UPCOMING CARD ===')
          start = html.find('<article class="card upcoming-card"')
          if start != -1:
              end = html.find('</article>', start)
              snippet = html[start:end+10]
              snippet = re.sub(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+', '[BASE64_IMAGE]', snippet)
              print(snippet[:12000])
          PY
