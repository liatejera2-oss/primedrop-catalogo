name: Inspect PRIME DROP filters

on:
  push:
    branches:
      - intervention/05-filters
    paths:
      - .github/workflows/inspect-filters.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/05-filters
      - name: Inspect filters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')

          print('=== FILTER CSS ===')
          terms = ['.filters {', '.filter-btn {', '.filter-count {', '.filter-status']
          for term in terms:
              i = html.find(term)
              if i != -1:
                  print('\n--', term, '--')
                  print(html[i:i+2500])

          print('\n=== FILTER HTML ===')
          i = html.find('<div class="filters"')
          if i != -1:
              print(html[i:i+2500])

          print('\n=== FILTER JS ===')
          for needle in ["const buttons = document.querySelectorAll('.filter-btn')", 'function applyFilter', 'function updateFilterCounts']:
              i = html.find(needle)
              if i != -1:
                  print('\n--', needle, '--')
                  print(html[i:i+6500])
                  break
          PY
