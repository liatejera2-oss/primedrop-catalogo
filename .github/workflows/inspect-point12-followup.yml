name: PRIME DROP inspect Point 12 followup
on:
  push:
    branches:
      - intervention/12-reservations-internal
    paths:
      - .github/workflows/inspect-point12-followup.yml
      - .github/scripts/inspect_point12_followup.py
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/12-reservations-internal
      - run: python .github/scripts/inspect_point12_followup.py
