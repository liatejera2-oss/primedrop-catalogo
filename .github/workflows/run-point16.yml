name: PRIME DROP Point 16
on:
  push:
    branches: [intervention/16-accessibility-robustness]
    paths: ['.github/scripts/point16.py', '.github/workflows/run-point16.yml']
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/16-accessibility-robustness
      - name: Patch accessibility and robustness
        run: python .github/scripts/point16.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re, tempfile, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          checks = [
            'class="skip-link"',
            'trapFocusWithin',
            "document.execCommand('copy')",
            "setAttribute('aria-busy', 'true')",
            'aria-live="polite"',
            'assets/media/'
          ]
          for token in checks:
              assert token in s, token
          assert 'data:image/' not in s
          assert '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>' in s
          assert 'supabase-js@2/dist/umd/supabase.js" defer' not in s
          assert 'id="purchaseModal" role="dialog" aria-modal="true" aria-labelledby="purchaseTitle" aria-hidden="true"' in s
          assert 'id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada del producto" aria-hidden="true"' in s
          clean=re.sub(r'<!--.*?-->', '', s, flags=re.S)
          scripts=re.findall(r'<script>(.*?)</script>', clean, flags=re.S)
          js='\n'.join(scripts)
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
              f.write(js); path=f.name
          subprocess.run(['node','--check',path], check=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Harden catalog accessibility and failure handling"
          git push origin HEAD:intervention/16-accessibility-robustness
