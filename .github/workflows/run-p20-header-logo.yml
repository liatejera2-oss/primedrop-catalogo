name: PRIME DROP header logo scale
on:
  push:
    branches: [intervention/20-header-logo]
    paths: ['.github/scripts/p20_header_logo.py', '.github/workflows/run-p20-header-logo.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/20-header-logo
      - name: Patch header logo
        run: python .github/scripts/p20_header_logo.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '.brand img { width: 48px; height: 48px;' in s
          assert '.brand img { width: 40px; height: 40px; flex-basis: 40px; }' in s
          assert 'width="48" height="48"' in s
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Increase header logo visibility"
          git push origin HEAD:intervention/20-header-logo
