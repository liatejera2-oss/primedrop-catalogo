name: PRIME DROP mobile refinement

on:
  push:
    branches:
      - intervention/06-mobile
    paths:
      - .github/workflows/patch-mobile.yml

permissions:
  contents: write

jobs:
  patch-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/06-mobile
      - name: Apply mobile refinement
        run: python .github/scripts/patch_mobile.py
      - name: Validate and commit
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine mobile layout and touch behavior"
          git push origin HEAD:intervention/06-mobile

# trigger mobile intervention
