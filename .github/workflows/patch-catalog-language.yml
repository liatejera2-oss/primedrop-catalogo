name: PRIME DROP catalog language

on:
  push:
    branches:
      - intervention/03-catalog-language
    paths:
      - .github/workflows/patch-catalog-language.yml

permissions:
  contents: write

jobs:
  patch-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/03-catalog-language
      - name: Apply catalog language adjustments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          replacements = [
              ('<div class="section-title">La selección<span>Piezas disponibles y próximos drops.</span></div>', '<div class="section-title">Catálogo disponible<span>Consulta las piezas disponibles y compra por Instagram.</span></div>'),
              ('<div class="section-title">Próximos drops</div>', '<div class="section-title">Próximos Drops</div>'),
              ('<p class="upcoming-intro">Nuevas piezas se incorporarán a la selección. Síguenos en Instagram para conocer primero cada lanzamiento.</p>', '<p class="upcoming-intro">Nuevos drops se incorporarán al catálogo. Síguenos en Instagram para conocer primero cada lanzamiento.</p>'),
          ]

          for old, new in replacements:
              if old not in html:
                  raise SystemExit(f'Expected catalog copy not found: {old}')
              html = html.replace(old, new, 1)

          old_cta = '>Consultar disponibilidad →</button>'
          cta_count = html.count(old_cta)
          if cta_count < 10:
              raise SystemExit(f'Expected at least 10 catalog CTAs, found {cta_count}')
          html = html.replace(old_cta, '>Comprar por Instagram →</button>')

          html, aria_count = re.subn(r'aria-label="Solicitar ([^"]+) por Instagram"', r'aria-label="Comprar \1 por Instagram"', html)
          if aria_count < 10:
              raise SystemExit(f'Expected at least 10 purchase aria-labels, changed {aria_count}')

          html = html.replace('"Consultar disponibilidad" abrirá Instagram directamente.', '"Comprar por Instagram" abrirá Instagram directamente.', 1)

          checks = [
              'Catálogo disponible<span>Consulta las piezas disponibles y compra por Instagram.</span>',
              '<div class="section-title">Próximos Drops</div>',
              'Nuevos drops se incorporarán al catálogo.',
              '>Comprar por Instagram →</button>',
          ]
          missing = [item for item in checks if item not in html]
          if missing:
              raise SystemExit(f'Post-change validation failed: {missing}')

          forbidden = [
              '<div class="section-title">La selección<span>Piezas disponibles y próximos drops.</span></div>',
              '>Consultar disponibilidad →</button>',
          ]
          remaining = [item for item in forbidden if item in html]
          if remaining:
              raise SystemExit(f'Old catalog language remains: {remaining}')

          if html == original:
              raise SystemExit('No catalog language changes produced.')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine catalog language and Instagram CTAs"
          git push origin HEAD:intervention/03-catalog-language
