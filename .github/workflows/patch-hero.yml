name: PRIME DROP hero positioning

on:
  push:
    branches:
      - intervention/02-hero-positioning
    paths:
      - .github/workflows/patch-hero.yml

permissions:
  contents: write

jobs:
  patch-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout intervention branch
        uses: actions/checkout@v4
        with:
          ref: intervention/02-hero-positioning
      - name: Apply hero positioning copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          replacements = [
              ('<span class="hero-eyebrow">Prime Drop / Selección 01</span>', '<span class="hero-eyebrow">Prime Drop / Catálogo</span>'),
              ('<h1>Racing &amp; football, cuidadosamente seleccionados.</h1>', '<h1>Estilo con identidad. Drops en cantidades limitadas.</h1>'),
              ('<p class="hero-sub">Piezas deportivas con identidad, disponibles en cantidades limitadas en Panamá.</p>', '<p class="hero-sub">Elige tu pieza en el catálogo y coordina tu compra directamente por Instagram. Disponible en Panamá.</p>'),
              ('<a class="hero-cta-secondary" href="https://instagram.com/primedrop.pa" target="_blank" rel="noopener noreferrer">Comprar en Instagram ↗</a>', '<a class="hero-cta-secondary" href="https://www.instagram.com/primedrop.pa/" target="_blank" rel="noopener noreferrer">Comprar por Instagram ↗</a>'),
              ('<p class="hero-trust">Unidades limitadas <span>·</span> Entregas en Panamá <span>·</span> Atención por Instagram</p>', '<p class="hero-trust">Unidades limitadas <span>·</span> Entregas en Panamá <span>·</span> Compra por Instagram</p>'),
          ]

          for old, new in replacements:
              if old not in html:
                  raise SystemExit(f'Expected hero fragment not found: {old}')
              html = html.replace(old, new, 1)

          checks = [
              'Prime Drop / Catálogo',
              'Estilo con identidad. Drops en cantidades limitadas.',
              'Elige tu pieza en el catálogo y coordina tu compra directamente por Instagram. Disponible en Panamá.',
              'href="https://www.instagram.com/primedrop.pa/"',
              '>Comprar por Instagram ↗</a>',
              'Compra por Instagram</p>',
          ]
          missing = [item for item in checks if item not in html]
          if missing:
              raise SystemExit(f'Post-change validation failed: {missing}')

          forbidden = [
              'Racing &amp; football, cuidadosamente seleccionados.',
              'Piezas deportivas con identidad, disponibles en cantidades limitadas en Panamá.',
              '>Comprar en Instagram ↗</a>',
          ]
          remaining = [item for item in forbidden if item in html]
          if remaining:
              raise SystemExit(f'Old hero copy still present: {remaining}')

          if html == original:
              raise SystemExit('No hero changes produced; aborting.')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git diff -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git commit -m "Refine hero positioning and Instagram purchase flow"
          git push origin HEAD:intervention/02-hero-positioning
