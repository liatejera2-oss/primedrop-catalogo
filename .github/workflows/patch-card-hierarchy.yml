name: PRIME DROP card hierarchy

on:
  push:
    branches:
      - intervention/04-card-hierarchy
    paths:
      - .github/workflows/patch-card-hierarchy.yml

permissions:
  contents: write

jobs:
  patch-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/04-card-hierarchy
      - name: Refine product card hierarchy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          replacements = [
            (
              ".card { background: var(--card-bg); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; opacity: 0; animation: rise .5s ease forwards; animation-delay: var(--delay); transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease; box-shadow: none; }",
              ".card { background: var(--card-bg); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; opacity: 0; animation: rise .5s ease forwards; animation-delay: var(--delay); transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease; box-shadow: none; display: flex; flex-direction: column; height: 100%; }"
            ),
            (
              ".card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-3px); border-color: #DEDEE0; }",
              ".card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-2px); border-color: #D8D8DB; }"
            ),
            (
              ".card-info { padding: 18px 4px 4px; }",
              ".card-info { padding: 20px; display: flex; flex-direction: column; flex: 1 1 auto; border-top: 1px solid var(--line); }"
            ),
            (
              ".team-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }",
              ".team-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }"
            ),
            (
              ".team-name { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); font-family: 'Inter', sans-serif; font-weight: 600; }",
              ".team-name { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); font-family: 'Inter', sans-serif; font-weight: 600; }"
            ),
            (
              ".card-info h3 { font-size: 16px; font-weight: 600; text-transform: none; letter-spacing: -0.01em; line-height: 1.3; margin-bottom: 8px; font-family: 'Inter', sans-serif; color: var(--ink); min-height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }",
              ".card-info h3 { font-size: 18px; font-weight: 600; text-transform: none; letter-spacing: -0.018em; line-height: 1.25; margin-bottom: 10px; font-family: 'Inter', sans-serif; color: var(--ink); min-height: 2.5em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }"
            ),
            (
              ".price { font-size: 16px; font-weight: 700; color: var(--ink); font-family: 'Inter', sans-serif; letter-spacing: -0.01em; }",
              ".price { font-size: 17px; font-weight: 700; color: var(--ink); font-family: 'Inter', sans-serif; letter-spacing: -0.015em; line-height: 1.25; }"
            ),
            (
              ".size-row { display: flex; gap: 6px; margin: 14px 0 14px; flex-wrap: wrap; }",
              ".size-row { display: flex; gap: 7px; margin: 16px 0 14px; flex-wrap: wrap; min-height: 32px; align-items: center; }"
            ),
            (
              ".size-chip { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; min-width: 34px; height: 30px; display: inline-flex; align-items: center; justify-content: center; cursor: default; transition: border-color .15s ease; }",
              ".size-chip { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 6px; min-width: 36px; height: 32px; display: inline-flex; align-items: center; justify-content: center; cursor: default; transition: border-color .15s ease; }"
            ),
            (
              ".size-caption { font-size: 11px; color: var(--ink-soft); margin: -8px 0 12px; }",
              ".size-caption { font-size: 11px; color: var(--ink-soft); margin: -7px 0 14px; line-height: 1.35; }"
            ),
            (
              ".ig-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 44px; background: var(--ink); color: #fff; text-decoration: none; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; border-radius: var(--radius-sm); transition: background .2s ease, transform .2s ease; margin-top: 4px; }",
              ".ig-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 46px; background: var(--ink); color: #fff; text-decoration: none; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; border-radius: var(--radius-sm); transition: background .2s ease, transform .2s ease; margin-top: auto; padding: 0 16px; }"
            ),
          ]

          for old, new in replacements:
              if old not in html:
                  raise SystemExit(f'Expected card CSS fragment not found: {old[:100]}')
              html = html.replace(old, new, 1)

          anchor = ".ig-btn:hover, .ig-btn:focus-visible { background: #000; transform: translateY(-1px); }"
          extra = "\n  .upcoming-card .price { font-size: 14px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0; }\n  .upcoming-card .size-row { margin-bottom: 0; }"
          if anchor not in html:
              raise SystemExit('IG button hover anchor not found')
          html = html.replace(anchor, anchor + extra, 1)

          required = [
              'display: flex; flex-direction: column; height: 100%;',
              '.card-info { padding: 20px; display: flex; flex-direction: column; flex: 1 1 auto; border-top: 1px solid var(--line); }',
              '.card-info h3 { font-size: 18px;',
              '.ig-btn { position: relative;',
              'margin-top: auto; padding: 0 16px;',
              '.upcoming-card .price { font-size: 14px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0; }'
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit(f'Card hierarchy validation failed: {missing}')

          if html == original:
              raise SystemExit('No card hierarchy changes produced')

          path.write_text(html, encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine product card hierarchy and spacing"
          git push origin HEAD:intervention/04-card-hierarchy
