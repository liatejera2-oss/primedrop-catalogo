name: PRIME DROP inspect Point 14 color
on:
  push:
    branches: [intervention/14-inventory]
    paths: ['.github/workflows/inspect-point14-color.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/14-inventory
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('panel-privado.html').read_text(encoding='utf-8')
          for key in ["getElementById('saveColorVariantBtn')", "getElementById('disableColorVariantsBtn')"]:
              i=s.rfind(key)
              print('\n===== '+key+' '+str(i)+' =====\n')
              print(s[max(0,i-1800):min(len(s),i+8500)])
          PY
