name: Inspect PRIME DROP upcoming flow

on:
  push:
    branches:
      - intervention/07-upcoming-drops
    paths:
      - .github/workflows/inspect-upcoming.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/07-upcoming-drops
      - name: Inspect upcoming drops flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for filename in ['index.html', 'panel-privado.html']:
              text = Path(filename).read_text(encoding='utf-8')
              print(f'=== {filename} ===')
              lines = text.splitlines()
              keywords = [
                  'upcoming', 'próximo', 'proximo', 'drop', 'available', 'disponible',
                  'status', 'estado', 'catalog', 'move', 'publish', 'stock', 'inventory'
              ]
              hits = []
              for n, line in enumerate(lines, 1):
                  low = line.lower()
                  if any(k in low for k in keywords):
                      # Avoid dumping embedded image/base64 lines
                      if 'base64,' in low or len(line) > 1200:
                          continue
                      hits.append(n)
              # merge nearby windows
              windows = []
              for n in hits:
                  a, b = max(1, n-4), min(len(lines), n+8)
                  if windows and a <= windows[-1][1] + 1:
                      windows[-1] = (windows[-1][0], max(windows[-1][1], b))
                  else:
                      windows.append((a,b))
              for a,b in windows[:80]:
                  print(f'--- lines {a}-{b} ---')
                  for i in range(a,b+1):
                      line = lines[i-1]
                      if 'base64,' in line or len(line) > 1200:
                          print(f'{i}: [long/embedded line omitted]')
                      else:
                          print(f'{i}: {line}')
          PY
