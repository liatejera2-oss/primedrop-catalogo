name: PRIME DROP Point 14
on:
  push:
    branches: [intervention/14-inventory]
    paths: ['.github/scripts/point14.py', '.github/workflows/run-point14.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: intervention/14-inventory
      - name: Patch inventory
        run: python .github/scripts/point14.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re, tempfile, subprocess
          s=Path('panel-privado.html').read_text(encoding='utf-8')
          for token in ['inventoryOverview','inventoryUnits','inventoryFilters','save_product_color_stock','data-stock-state']:
              if token == 'inventoryOverview':
                  assert 'inventory-overview' in s
              else:
                  assert token in s, token
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S)
          js='\n'.join(scripts)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); path=f.name
          subprocess.run(['node','--check',path],check=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-privado.html
          git commit -m "Harden inventory operations and color updates"
          git push origin HEAD:intervention/14-inventory
